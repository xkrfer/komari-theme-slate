<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" vite-ignore />
    <link
      id="font-logos-stylesheet"
      rel="stylesheet"
      data-href="/assets/font-logos/font-logos.css"
    />
    <noscript>
      <link rel="stylesheet" href="/assets/font-logos/font-logos.css" />
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex"
    />
    <title>Komari Monitor</title>
    <meta name="description" content="A simple server monitor tool." />
    <script>
      (() => {
        const root = document.documentElement;
        if (location.pathname === "/" || location.pathname === "/index.html") {
          root.classList.add("prerender-home");
          try {
            const storedView = localStorage.getItem("slate:view");
            if (
              storedView === "cards" ||
              (!storedView && matchMedia("(max-width: 767px)").matches)
            ) {
              root.classList.add("prerender-cards");
            } else if (storedView === "map") {
              root.classList.add("prerender-map");
            }
          } catch {
            // Use the table skeleton when storage is unavailable.
          }
        }
        let appearance = "system";
        try {
          appearance = localStorage.getItem("appearance") || "system";
        } catch {
          // Use the system appearance when storage is unavailable.
        }
        const dark =
          appearance === "dark" ||
          (appearance !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        root.classList.add(dark ? "dark" : "light");
      })();
    </script>
    <style>
      html {
        --ps-scrollbar-thumb: rgb(120 113 108 / 48%);
        scrollbar-gutter: stable;
        scrollbar-width: thin;
      }
      html.dark {
        --ps-scrollbar-thumb: rgb(168 162 158 / 52%);
      }
      html::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      html::-webkit-scrollbar-track {
        background: transparent;
      }
      html::-webkit-scrollbar-thumb {
        border: 2px solid transparent;
        border-radius: 999px;
        background: transparent;
        background-clip: padding-box;
      }
      html::-webkit-scrollbar-thumb:hover,
      html::-webkit-scrollbar-thumb:active {
        background: var(--ps-scrollbar-thumb);
        background-clip: padding-box;
      }
      @supports (-moz-appearance: none) {
        html {
          scrollbar-color: transparent transparent;
        }
        html:hover,
        html:focus-within {
          scrollbar-color: var(--ps-scrollbar-thumb) transparent;
        }
      }
      #home-prerender {
        display: none;
      }
      html.prerender-home #home-prerender {
        --ps-bg: #fafafa;
        --ps-card: #fff;
        --ps-border: #e7e5e4;
        --ps-muted: #f5f4f3;
        --ps-foreground: #1c1917;
        --ps-muted-foreground: #6f6863;
        position: absolute;
        z-index: 2147483647;
        inset: 0 0 auto;
        display: flex;
        min-height: 100svh;
        flex-direction: column;
        background: var(--ps-bg);
      }
      html.prerender-home #home-prerender::after {
        content: "";
        flex: 0 0 88px;
      }
      html.dark #home-prerender {
        --ps-bg: #171412;
        --ps-card: #0c0a09;
        --ps-border: #292524;
        --ps-muted: #24201e;
        --ps-foreground: #fafaf9;
        --ps-muted-foreground: #a8a29e;
      }
      body {
        margin: 0;
      }
      .ps-header {
        flex: 0 0 64px;
        height: 64px;
      }
      .ps-header-inner,
      .ps-main {
        box-sizing: border-box;
        width: min(100%, 1152px);
        margin-inline: auto;
        padding-inline: 16px;
      }
      .ps-header-inner {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: space-between;
      }
      .ps-brand,
      .ps-actions,
      .ps-card-row,
      .ps-section-head {
        display: flex;
        align-items: center;
      }
      .ps-brand {
        min-width: 0;
        gap: 10px;
      }
      .ps-actions {
        gap: 6px;
      }
      .ps-line,
      .ps-table-head,
      .ps-cell {
        background: var(--ps-muted);
      }
      .ps-logo {
        display: flex;
        flex: 0 0 auto;
        width: 32px;
        height: 32px;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        background: var(--ps-foreground);
        color: var(--ps-card);
        box-shadow: 0 1px 2px rgb(0 0 0 / 8%);
      }
      .ps-brand-copy {
        display: grid;
        min-width: 0;
        gap: 1px;
        color: var(--ps-foreground);
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      .ps-brand-subtitle {
        color: var(--ps-muted-foreground);
        font-size: 12px;
        line-height: 16px;
      }
      .ps-line {
        height: 10px;
        border-radius: 999px;
      }
      .ps-line-title {
        width: 112px;
        height: 12px;
      }
      .ps-logo svg,
      .ps-action svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentcolor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ps-action {
        box-sizing: border-box;
        display: flex;
        width: 32px;
        height: 32px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ps-border);
        border-radius: 8px;
        background: var(--ps-card);
        color: var(--ps-foreground);
        box-shadow: 0 1px 2px rgb(0 0 0 / 6%);
      }
      .ps-main {
        box-sizing: border-box;
        padding-block: 56px;
      }
      .ps-intro {
        display: grid;
        gap: 4px;
        margin-bottom: 24px;
        color: var(--ps-foreground);
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      .ps-intro-title {
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
      }
      .ps-intro-description {
        color: var(--ps-muted-foreground);
        font-size: 14px;
        line-height: 20px;
      }
      .ps-stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .ps-card {
        box-sizing: border-box;
        height: 112px;
        padding: 16px;
        border: 1px solid var(--ps-border);
        border-radius: 8px;
        background: var(--ps-card);
      }
      .ps-card-row {
        align-items: flex-start;
        justify-content: space-between;
      }
      .ps-stat-label {
        width: 80px;
        height: 12px;
      }
      .ps-stat-value {
        width: 56px;
        height: 28px;
        margin-top: 12px;
        border-radius: 6px;
      }
      .ps-stat-icon {
        width: 32px;
        height: 32px;
        border-radius: 6px;
      }
      .ps-list {
        margin-top: 40px;
      }
      .ps-section-head {
        min-height: 46px;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .ps-section-copy {
        display: grid;
        gap: 8px;
      }
      .ps-section-copy .ps-line:first-child {
        width: 64px;
        height: 16px;
      }
      .ps-section-copy .ps-line:last-child {
        width: 176px;
        height: 12px;
      }
      .ps-toolbar {
        width: 176px;
        height: 36px;
        border-radius: 8px;
      }
      .ps-table {
        overflow: hidden;
        border: 1px solid var(--ps-border);
        border-radius: 8px;
        background: var(--ps-card);
      }
      .ps-cards,
      .ps-map {
        display: none;
      }
      html.prerender-cards .ps-table,
      html.prerender-map .ps-table {
        display: none;
      }
      html.prerender-cards .ps-cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      html.prerender-map .ps-map {
        display: block;
      }
      .ps-node-card {
        box-sizing: border-box;
        height: 384px;
        padding: 16px;
        border: 1px solid var(--ps-border);
        border-radius: 8px;
        background: var(--ps-card);
      }
      .ps-node-card .ps-line:nth-child(2) {
        width: 72%;
        margin-top: 28px;
      }
      .ps-node-card .ps-line:nth-child(3) {
        width: 100%;
        height: 64px;
        margin-top: 28px;
        border-radius: 6px;
      }
      .ps-node-card .ps-line:nth-child(4) {
        width: 100%;
        height: 40px;
        margin-top: 84px;
        border-radius: 6px;
      }
      .ps-map {
        box-sizing: border-box;
        height: 562px;
        padding: 64px 20px 20px;
        border: 1px solid var(--ps-border);
        border-radius: 8px;
        background: var(--ps-card);
      }
      .ps-map .ps-line {
        width: 100%;
        height: 100%;
        border-radius: 6px;
      }
      .ps-table-head {
        height: 40px;
      }
      .ps-row {
        box-sizing: border-box;
        display: grid;
        height: 60px;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        align-items: center;
        gap: 16px;
        padding-inline: 16px;
        border-top: 1px solid var(--ps-border);
      }
      .ps-cell {
        width: 64px;
        max-width: 100%;
        height: 10px;
        border-radius: 999px;
      }
      .ps-cell:first-child {
        width: 96px;
      }
      .ps-cell:last-child {
        width: 96px;
      }
      .ps-cell:nth-child(2) {
        width: 48px;
      }
      .ps-cell:nth-child(3) {
        width: 40px;
      }
      .ps-cell:nth-child(n + 4):nth-child(-n + 6) {
        height: 24px;
        border-radius: 6px;
      }
      .ps-line,
      .ps-table-head,
      .ps-cell {
        animation: ps-pulse 2.4s ease-in-out infinite;
      }
      @keyframes ps-pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 0.9;
        }
      }
      @media (max-width: 767px) {
        .ps-main {
          padding-block: 40px;
        }
        .ps-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .ps-section-head {
          align-items: flex-end;
          gap: 16px;
        }
        .ps-toolbar {
          width: 108px;
        }
        .ps-row {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        html.prerender-cards .ps-cards {
          grid-template-columns: minmax(0, 1fr);
        }
        .ps-map {
          height: 394px;
        }
        .ps-cell:nth-child(n + 5) {
          display: none;
        }
      }
      @media (min-width: 768px) and (max-width: 1023px) {
        html.prerender-cards .ps-cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .ps-map {
          height: 502px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ps-line,
        .ps-table-head,
        .ps-cell {
          animation: none;
        }
      }
    </style>
  </head>
